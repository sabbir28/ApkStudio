name: Release

on:
  push:
    branches: [ main, master ]
    tags:
      - "v*.*.*"
      - "v*"
  workflow_dispatch:

# additional permissions for provided GitHub token to create new release
permissions:
  contents: write

jobs:
  build-release-win-bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: oracle-actions/setup-java@v1
        with:
          release: 25

      - name: Set jadx version
        uses: actions/github-script@v9
        with:
          script: |
            let ver;
            if (context.ref.startsWith('refs/tags/v')) {
              ver = context.ref.replace('refs/tags/v', '');
            } else {
              const sha = context.sha ? context.sha.substring(0, 7) : 'dev';
              ver = `1.5.1-r${context.runNumber}.${sha}`;
            }
            core.exportVariable('JADX_VERSION', ver);

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build No-JRE bundle
        run: ./gradlew dist -PjadxBundleType=win-no-jre

      - name: Save bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ format('jadx-gui-{0}-win.zip', env.JADX_VERSION) }}
          path: ${{ format('build/distWin/jadx-gui-{0}-win.zip', env.JADX_VERSION) }}
          if-no-files-found: error
          retention-days: 1

      - name: Build JRE bundle
        run: ./gradlew dist -PbundleJRE=true -PjadxBundleType=win-jre

      - name: Save JRE bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ format('jadx-gui-{0}-with-jre-win.zip', env.JADX_VERSION) }}
          path: ${{ format('build/distWinWithJre/jadx-gui-{0}-with-jre-win.zip', env.JADX_VERSION) }}
          if-no-files-found: error
          retention-days: 1

      # Prepare build for 'msi' bundle
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Install WiX Toolset
        run: |
          dotnet tool install wix --global --version 5.0.2
          wix extension add --global WixToolset.Util.wixext/5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
          wix.exe --version

      - name: Build msi bundle
        run: ./gradlew :jadx-gui:jpackage -PjadxBundleType=msi

      - name: Save msi artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ format('jadx-gui-{0}.msi', env.JADX_VERSION) }}
          path: jadx-gui/build/jpackage/jadx-gui-*.msi
          if-no-files-found: error
          retention-days: 1

  build-release-mac-bundle:
    strategy:
      matrix:
        os: [ macos-latest ]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set jadx version
        uses: actions/github-script@v9
        with:
          script: |
            let ver;
            if (context.ref.startsWith('refs/tags/v')) {
              ver = context.ref.replace('refs/tags/v', '');
            } else {
              const sha = context.sha ? context.sha.substring(0, 7) : 'dev';
              ver = `1.5.1-r${context.runNumber}.${sha}`;
            }
            core.exportVariable('JADX_VERSION', ver);

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew distMac -PjadxBundleType=dmg

      - name: Save macOS DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ format('jadx-gui-{0}-mac-{1}', env.JADX_VERSION, runner.arch) }}
          path: build/distMac/*.dmg
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [ build-release-win-bundle, build-release-mac-bundle ]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set jadx version and release tag
        uses: actions/github-script@v9
        with:
          script: |
            let ver, tag;
            if (context.ref.startsWith('refs/tags/v')) {
              ver = context.ref.replace('refs/tags/v', '');
              tag = 'v' + ver;
            } else {
              const sha = context.sha ? context.sha.substring(0, 7) : 'dev';
              ver = `1.5.1-r${context.runNumber}.${sha}`;
              tag = 'v' + ver;
            }
            core.exportVariable('JADX_VERSION', ver);
            core.exportVariable('RELEASE_TAG', tag);

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew dist -PjadxBundleType=app
        env:
          JADX_BUILD_JAVA_VERSION: 11

      - name: Download Windows NO-JRE bundle
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ${{ format('jadx-gui-{0}-win.zip', env.JADX_VERSION) }}
          path: build

      - name: Download Windows JRE bundle
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ${{ format('jadx-gui-{0}-with-jre-win.zip', env.JADX_VERSION) }}
          path: build

      - name: Download Windows MSI bundle
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ${{ format('jadx-gui-{0}.msi', env.JADX_VERSION) }}
          path: build

      - name: Download macOS DMG bundles
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: ${{ format('jadx-gui-{0}-mac-*', env.JADX_VERSION) }}
          merge-multiple: true
          path: build

      - name: Package Standalone Apk Live Modder
        run: |
          cd tools/apk-live-modder
          zip -r ../../build/ApkStudio-standalone-modder.zip . -x "*__pycache__*" "*.pyc" "bin/jadx/*"
          cd ../..

      - run: |
          cd build
          ls -la

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ format('ApkStudio {0}', env.RELEASE_TAG) }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          generate_release_notes: true
          body: |
            ### 🚀 ApkStudio Release (${{ env.RELEASE_TAG }})

            **ApkStudio** allows direct in-app editing of decompiled Java code and live APK recompilation and signing.

            #### 🌟 Features in ApkStudio:
            - **⚡ Live Java Code Editing**: Edit decompiled Java sources and save/patch directly into a working APK.
            - **🔄 Automated Ghost Pipeline**: Seamlessly compiles Java (ECJ) $\to$ DEX (D8) $\to$ Smali (Baksmali) $\to$ APK (Apktool) $\to$ Signed APK (Uber-Signer).
            - **🛠 Standalone Modder Included**: Standalone CLI & GUI patcher included in `ApkStudio-standalone-modder.zip`.

            #### 📦 Downloads:
            - **Windows (Recommended with JRE)**: `jadx-gui-*-with-jre-win.zip` (standalone, no Java installation needed)
            - **Windows (No JRE)**: `jadx-gui-*-win.zip`
            - **Windows Installer**: `jadx-gui-*.msi`
            - **All Platforms (Linux, macOS, Windows)**: `jadx-*.zip`
            - **macOS (DMG installer)**: `jadx-gui-*-mac-*.dmg`
            - **Standalone Live Modder Tool**: `ApkStudio-standalone-modder.zip`
          files: |
            build/jadx-*.zip
            build/jadx-gui-*.zip
            build/jadx-gui-*.msi
            build/jadx-gui-*-mac-*.dmg
            build/ApkStudio-standalone-modder.zip
